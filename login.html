<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/gtm/gtm.js"></script>
    <meta charset="UTF-8">
    <title>NextStore | Autenticação</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P9KTM5ZM" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <nav class="navbar">
        <a href="index.html" class="logo">Next<span>Store</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Produtos</a>
            <a href="login.html">Entrar</a>
            <a href="checkout.html">Carrinho <span id="cart-count" class="cart-badge">0</span></a>
        </div>
    </nav>

    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="form-wrapper" style="width: 100%;">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Acesse sua Conta</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Entrar</button>
                <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                    Não tem uma conta? <a href="#" style="color: var(--accent-color); font-weight: 600;">Cadastre-se</a>
                </p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 NextStore E-commerce.</p>
    </footer>

    <script src="js/index.js"></script>
    <script src="js/dataLayer.js"></script>
</body>

</html>
